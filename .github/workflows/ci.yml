name: CI

on:
  push:
    branches: [main, "prep/**"]
  pull_request:
  workflow_dispatch:

jobs:
  # Unit tests of the CLI, which also check that the repo stays generic: no
  # use-case leftovers, and event pages kept in their own docs folder.
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s cli/tests -v

  demo-factory:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/demo-factory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/demo-factory/go.mod
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go build ./...

  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
      - name: The API reference matches the OpenAPI specs
        run: |
          npm run generate:api
          git diff --exit-code -- content/docs/api || (echo "Run: npm run generate:api" && exit 1)
      - run: npm run types:check
      - run: npm run build

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every compose file renders with versions.env
        run: |
          set -e
          # Prod reads the real env files an operator writes; the examples stand in.
          for f in static/envs/*/*.env.example; do cp "$f" "${f%.example}"; done
          for f in deployment/standalone/*.yaml deployment/prod/*.yaml services/demo-factory/docker-compose.yaml; do
            echo "== $f"
            docker compose --env-file versions.env -f "$f" config -q
          done
          # The instance templates need the variables `eunomia connector add` writes.
          export INSTANCE=ci ROLE=consumer HTTP_PORT=1600 DB_PORT=15400 REDIS_PASSWORD=x
          for f in deployment/instances/*.yaml; do
            echo "== $f"
            docker compose --env-file versions.env -p eunomia-ci -f "$f" config -q
          done

  # The whole standalone deployment, from nothing to a pull and a push transfer.
  e2e:
    runs-on: ubuntu-latest
    needs: [unit, compose-config]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: ./eunomia doctor
      - run: ./eunomia up
      - run: ./eunomia e2e
      - name: Extra connectors talk to each other too
        run: |
          ./eunomia connector add ci-seller --role provider --onboard
          ./eunomia connector add ci-buyer --onboard
          ./eunomia gaia --consumer ci-buyer --provider ci-seller
          ./eunomia catalog populate --provider ci-seller
          ./eunomia e2e --consumer ci-buyer --provider ci-seller --no-suspend
      - name: Logs on failure
        if: failure()
        run: |
          ./eunomia status || true
          for n in authority provider consumer demo; do ./eunomia logs "$n" --tail 300 || true; done
      - run: ./eunomia down --yes
        if: always()
