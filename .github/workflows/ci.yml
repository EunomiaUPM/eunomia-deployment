name: CI

on:
  push:
    branches: [main, "prep/**"]
  pull_request:
  workflow_dispatch:

jobs:
  # Unit tests of the CLI, which also check that the repo stays generic: no
  # use-case leftovers, and event pages kept in their own docs folder.
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s cli/tests -v

  demo-factory:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/demo/service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: extensions/demo/service/go.mod
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go build ./...

  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
      - name: The API reference matches the OpenAPI specs
        run: |
          npm run generate:api
          git diff --exit-code -- content/docs/api || (echo "Run: npm run generate:api" && exit 1)
      - run: npm run types:check
      - run: npm run build

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every compose file renders with versions.env
        run: |
          set -e
          # Prod reads the real env files an operator writes; the examples stand in.
          for f in static/envs/*/*.env.example; do cp "$f" "${f%.example}"; done
          for f in deployment/standalone/*.yaml deployment/prod/*.yaml extensions/*/service/docker-compose.yaml; do
            echo "== $f"
            docker compose --env-file versions.env -f "$f" config -q
          done
          # The instance templates need the variables `eunomia connector add` writes.
          export INSTANCE=ci CONTAINER=eunomia-ci HTTP_PORT=1600 DB_PORT=15400 REDIS_PASSWORD=x
          for f in deployment/instances/*.yaml; do
            echo "== $f"
            docker compose --env-file versions.env -p eunomia-ci -f "$f" config -q
          done

  # A whole data space from nothing: an authority, two agents and the demo,
  # with each agent taking each role in turn.
  e2e:
    runs-on: ubuntu-latest
    needs: [unit, compose-config]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: ./eunomia doctor
      - run: ./eunomia authority add authority
      - run: ./eunomia agent add alice
      - run: ./eunomia agent add bob
      - run: ./eunomia demo up
      - name: bob negotiates for the catalog of alice
        run: |
          ./eunomia demo publish alice
          ./eunomia demo test --consumer bob --provider alice
      - name: and the other way round
        run: |
          ./eunomia demo publish bob
          ./eunomia demo test --consumer alice --provider bob --no-suspend
      - name: The demo notebooks run headless
        run: ./eunomia demo notebook alice bob --execute
      - name: Logs on failure
        if: failure()
        run: |
          ./eunomia status || true
          for n in authority alice bob demo; do ./eunomia logs "$n" --tail 300 || true; done
      - run: ./eunomia down --yes
        if: always()
