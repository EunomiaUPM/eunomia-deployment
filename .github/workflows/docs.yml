name: Docs

# Publishes the site in docs/ to GitHub Pages:
# https://eunomiaupm.github.io/eunomia-deployment
on:
  push:
    branches: [main]
    paths: ["docs/**", "static/specs/**", "services/demo-factory/specs/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    env:
      NEXT_PUBLIC_BASE_PATH: /eunomia-deployment
      NEXT_PUBLIC_SITE_URL: https://eunomiaupm.github.io/eunomia-deployment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
