# Edge of the mini deployment in Keycloak mode: the only published port (80). Routes each request
# by host name: protocol routes straight to the component, user routes after asking that
# component's gatekeeper (oauth2-proxy, auth_request mode). Nothing else publishes ports.
#
#   browser / containers --> nginx :80 --> component            (protocol routes)
#                                    \--> gatekeeper "?" --> component (user routes)
#
# Upstreams are resolved per request (Docker DNS), so nginx starts even when some component is
# not up yet (run-mini.ps1 -Target ...).

resolver 127.0.0.11 valid=10s ipv6=off;

# "upgrade" for WebSocket handshakes, empty (keep-alive to the component) for the rest.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# Keycloak and oauth2-proxy send large headers (session cookies, tokens).
proxy_buffer_size 32k;
proxy_buffers 8 32k;
large_client_header_buffers 4 32k;

# Unknown host names.
server {
    listen 80 default_server;
    return 404;
}

# ==========================
# KEYCLOAK
# ==========================
server {
    listen 80;
    server_name keycloak.localhost;
    set $keycloak http://keycloak:8080;

    location / {
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass $keycloak;
    }
}

# ==========================
# AUTHORITY (heimdall)
# ==========================
server {
    listen 80;
    server_name authority.localhost;
    set $component http://heimdall:1500;
    set $gatekeeper http://heimdall-proxy:4180;

    include /etc/nginx/snippets/gatekeeper.conf;

    # Protocol routes
    location ~ ^/\.well-known/(did\.json|openid-credential-issuer|oauth-authorization-server|federated-catalog)$ {
        include /etc/nginx/snippets/protocol.conf;
    }
    location ~ ^/api/v1/gate/(access|continue/[^/]+)$ {
        include /etc/nginx/snippets/protocol.conf;
    }
    location ~ ^/api/v1/issuer/(credentialOffer|token|credential)$ {
        include /etc/nginx/snippets/protocol.conf;
    }
    location ~ ^/api/v1/verifier/(pd|verify|request)/[^/]+$ {
        include /etc/nginx/snippets/protocol.conf;
    }
    location ~ ^/(api/v1/)?(health|healthz|liveness|readiness)$ {
        include /etc/nginx/snippets/protocol.conf;
    }

    # User routes: the API answers 401 without a session; the console pages go to sign in.
    location /api/ {
        include /etc/nginx/snippets/user.conf;
    }
    location / {
        error_page 401 = /oauth2/sign_in;
        include /etc/nginx/snippets/user.conf;
    }
}

# ==========================
# PROVIDER
# ==========================
server {
    listen 80;
    server_name provider.localhost;
    set $component http://provider:1200;
    set $gatekeeper http://provider-proxy:4180;

    include /etc/nginx/snippets/gatekeeper.conf;
    include /etc/nginx/snippets/agent-protocol.conf;

    location /admin/api/ {
        include /etc/nginx/snippets/user.conf;
    }
    location /api/ {
        include /etc/nginx/snippets/user.conf;
    }
    location / {
        error_page 401 = /oauth2/sign_in;
        include /etc/nginx/snippets/user.conf;
    }
}

# ==========================
# CONSUMER
# ==========================
server {
    listen 80;
    server_name consumer.localhost;
    set $component http://consumer:1100;
    set $gatekeeper http://consumer-proxy:4180;

    include /etc/nginx/snippets/gatekeeper.conf;
    include /etc/nginx/snippets/agent-protocol.conf;

    location /admin/api/ {
        include /etc/nginx/snippets/user.conf;
    }
    location /api/ {
        include /etc/nginx/snippets/user.conf;
    }
    location / {
        error_page 401 = /oauth2/sign_in;
        include /etc/nginx/snippets/user.conf;
    }
}
