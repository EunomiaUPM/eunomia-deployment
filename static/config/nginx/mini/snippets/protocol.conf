# Protocol routes (peers, wallets, authorities): straight to the component, untouched. Their
# Authorization (GNAP, DSP, OID4VCI tokens) reaches it as sent, and proxy_pass without a path
# keeps the URI exactly as it came (no decoding of %2F or merged slashes).
include /etc/nginx/snippets/proxy-headers.conf;
# Nobody passes a user token on these routes.
proxy_set_header X-Eunomia-User-Token "";
proxy_pass $component;
