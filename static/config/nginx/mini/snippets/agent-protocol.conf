# Protocol routes of a connector (provider and consumer): DSP, GNAP, OID4VP, callbacks, data
# plane and well-known documents. Regex locations win over the /api/ and / prefixes of the
# server, so these never reach the gatekeeper.

location ~ ^/\.well-known/(did\.json|dspace-version(/[^/]+)?|openid-configuration)$ {
    include /etc/nginx/snippets/protocol.conf;
}
location ~ "^/api/v1/gate/(access|continue/[^/]+|token/[A-Za-z0-9_-]{43})$" {
    include /etc/nginx/snippets/protocol.conf;
}
location ~ ^/api/v1/verifier/(pd|verify|request)/[^/]+$ {
    include /etc/nginx/snippets/protocol.conf;
}
location ~ ^/api/v1/(vc-request|peer-connection)/callback/[^/]+$ {
    include /etc/nginx/snippets/protocol.conf;
}
location ~ ^/dsp/current/catalog/(request|datasets/[^/]+)$ {
    include /etc/nginx/snippets/protocol.conf;
}
location ~ ^/dsp/current/negotiations/(request|offers|[^/]+(/(offers|request|events|agreement|agreement/verification|termination))?)$ {
    include /etc/nginx/snippets/protocol.conf;
}
location ~ ^/dsp/current/transfers/(request|[^/]+(/(completion|start|suspension|termination))?)$ {
    include /etc/nginx/snippets/protocol.conf;
}
location ^~ /dataplane/proxy/ {
    include /etc/nginx/snippets/protocol.conf;
}
location ~ ^/(api/v1/)?(health|healthz|liveness|readiness)$ {
    include /etc/nginx/snippets/protocol.conf;
}
