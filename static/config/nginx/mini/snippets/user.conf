# User routes (console and its API): the gatekeeper (oauth2-proxy) checks the session first.
# On 202 it answers with the user's token, which goes to the component in X-Eunomia-User-Token
# (replacing whatever the client sent); on 401 the location decides (sign-in page or plain 401).
auth_request /oauth2/auth;
auth_request_set $user_token $upstream_http_x_auth_request_access_token;
# A session the gatekeeper refreshed comes back as a new cookie.
auth_request_set $auth_cookie $upstream_http_set_cookie;
add_header Set-Cookie $auth_cookie;

include /etc/nginx/snippets/proxy-headers.conf;
proxy_set_header X-Eunomia-User-Token $user_token;
proxy_pass $component;
