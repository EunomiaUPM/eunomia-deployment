# Common to every proxied location. Included in each one: in nginx a location that sets any
# proxy_set_header inherits none from the server, so they cannot live at server level.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
# WebSockets (the console's live updates): pass the upgrade through; plain requests keep the
# connection to the component alive ($connection_upgrade is "" then, see conf.d/mini.conf).
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;

# Event streams (SSE) and data plane transfers: no buffering, long-lived, any size.
proxy_buffering off;
proxy_request_buffering off;
proxy_read_timeout 1h;
client_max_body_size 0;
