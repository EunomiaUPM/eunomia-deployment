# The gatekeeper's own endpoints, for a server with $gatekeeper set.

# Sign-in, callback and sign-out: the browser talks to oauth2-proxy itself.
location /oauth2/ {
    include /etc/nginx/snippets/proxy-headers.conf;
    proxy_set_header X-Auth-Request-Redirect $request_uri;
    proxy_pass $gatekeeper;
}

# The session check behind every user route (auth_request): headers only, no body.
location = /oauth2/auth {
    internal;
    include /etc/nginx/snippets/proxy-headers.conf;
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header Content-Length "";
    proxy_pass_request_body off;
    proxy_pass $gatekeeper;
}
