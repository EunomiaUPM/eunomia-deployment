[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "eunomia"
version = "0.4.0"
description = "Deploy, onboard and try an EUNOMIA dataspace"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
eunomia = "eunomia.cli:main"

[tool.setuptools.packages.find]
where = ["cli"]
