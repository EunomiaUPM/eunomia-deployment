syntax = "proto3";

package robots;

option go_package = "specs/proto/robots;robots";

// Robot message definition
message Robot {
    int32 id = 1;
    string name = 2;
    string model = 3;
    string line = 4;
}

// Request to get a robot by ID
message GetRobotRequest {
    int32 id = 1;
}

// Response with a single robot
message GetRobotResponse {
    Robot robot = 1;
}

// Request to list robots
message ListRobotsRequest {
    int32 page = 1;
    int32 page_size = 2;
}

// Response with a list of robots
message ListRobotsResponse {
    repeated Robot robots = 1;
}

// Robot service definition
service RobotService {
    rpc GetRobot(GetRobotRequest) returns (GetRobotResponse);
    rpc ListRobots(ListRobotsRequest) returns (ListRobotsResponse);
}
