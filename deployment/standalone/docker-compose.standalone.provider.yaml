name: ${EUNOMIA_PREFIX:-eunomia}-provider

services:
  provider-db:
    container_name: "${EUNOMIA_PREFIX:-eunomia}-provider-db"
    image: postgres:18
    restart: always
    env_file:
      - ./../../static/envs/provider/db.env.example
    ports:
      - "${EUNOMIA_PROVIDER_DB_PORT:-1400}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U standalone_provider"]
      interval: 10s
      retries: 10

  provider-redis:
    image: redis:8-alpine
    restart: always
    container_name: "${EUNOMIA_PREFIX:-eunomia}-provider-redis"
    command: >
      redis-server  --requirepass ds_core_provider_redis --user admin on
      >ds_core_provider_redis ~* +@all

  # =========================
  # Fafnir wallet
  # =========================
  provider-fafnir-setup:
    container_name: "${EUNOMIA_PREFIX:-eunomia}-provider-fafnir-setup"
    image: "${FAFNIR_IMAGE:?set FAFNIR_IMAGE in versions.env}:${FAFNIR_TAG:?set FAFNIR_TAG in versions.env}"
    platform: linux/amd64
    depends_on:
      provider-db:
        condition: service_healthy
    volumes:
      - ./../../static/config/provider/standalone/fafnir.provider.yaml:/app/static/fafnir/config.yaml
      - ./../../vault/provider/secrets/db.json.example:/app/vault/secrets/db.json.example
    env_file:
      - ./../../static/envs/provider/fafnir.env.example
    environment:
      RUST_BACKTRACE: 1
    command: ["setup", "--env-file", "/app/static/fafnir/config.yaml"]
    restart: "no"

  provider-fafnir-wallet:
    container_name: "${EUNOMIA_PREFIX:-eunomia}-provider-fafnir-wallet"
    image: "${FAFNIR_IMAGE:?set FAFNIR_IMAGE in versions.env}:${FAFNIR_TAG:?set FAFNIR_TAG in versions.env}"
    platform: linux/amd64
    restart: always
    depends_on:
      provider-fafnir-setup:
        condition: service_completed_successfully
    volumes:
      - ./../../static/config/provider/standalone/fafnir.provider.yaml:/app/static/fafnir/config.yaml
      - ./../../vault/provider/secrets/db.json.example:/app/vault/secrets/db.json.example
    env_file:
      - ./../../static/envs/provider/fafnir.env.example
    environment:
      RUST_BACKTRACE: 1
    command: ["start", "--env-file", "/app/static/fafnir/config.yaml"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7001/readiness"]
      interval: 10s
      timeout: 2s
      retries: 10
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # =========================
  # Setup job (one-shot)
  # =========================
  provider-setup:
    container_name: "${EUNOMIA_PREFIX:-eunomia}-provider-setup"
    image: "${EUNOMIA_IMAGE:?set EUNOMIA_IMAGE in versions.env}:${EUNOMIA_TAG:?set EUNOMIA_TAG in versions.env}"
    platform: linux/amd64
    command: ["setup", "-e", "/app/static/config/standalone.provider.yaml"]
    volumes:
      - ./../../static/config/provider/standalone:/app/static/config
      - ./../../static/specs/agent:/app/static/specs
      - ./../../static/policy_templates:/app/static/policy_templates
      - ./../../vault/provider:/app/vault
    depends_on:
      - provider-db
      - provider-redis
    env_file:
      - ./../../static/envs/provider/core.env.example
    restart: "no"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # =========================
  # Main service
  # =========================
  provider:
    container_name: "${EUNOMIA_PREFIX:-eunomia}-provider"
    image: "${EUNOMIA_IMAGE:?set EUNOMIA_IMAGE in versions.env}:${EUNOMIA_TAG:?set EUNOMIA_TAG in versions.env}"
    platform: linux/amd64
    command: ["start", "-e", "/app/static/config/standalone.provider.yaml"]
    ports:
      - "1200:1200"
    volumes:
      - ./../../static/config/provider/standalone:/app/static/config
      - ./../../static/specs/agent:/app/static/specs
      - ./../../static/policy_templates:/app/static/policy_templates
      - ./../../vault/provider:/app/vault
    depends_on:
      provider-setup:
        condition: service_completed_successfully
      provider-db:
        condition: service_started
      provider-redis:
        condition: service_started
      provider-fafnir-wallet:
        condition: service_healthy
    env_file:
      - ./../../static/envs/provider/core.env.example
    environment:
      RUST_BACKTRACE: full
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:1200/api/v1/readiness"]
      interval: 5s
      timeout: 2s
      retries: 24
    extra_hosts:
      - "host.docker.internal:host-gateway"
