name: ${EUNOMIA_PREFIX:-eunomia}-consumer

services:
  consumer-db:
    container_name: "${EUNOMIA_PREFIX:-eunomia}-consumer-db"
    image: postgres:18
    restart: always
    env_file:
      - ./../../static/envs/consumer/db.env.example
    ports:
      - "${EUNOMIA_CONSUMER_DB_PORT:-1300}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U standalone_consumer"]
      interval: 10s
      retries: 10

  consumer-redis:
    image: redis:8-alpine
    restart: always
    container_name: "${EUNOMIA_PREFIX:-eunomia}-consumer-redis"
    command: >
      redis-server  --requirepass ds_core_consumer_redis --user admin on
      >ds_core_consumer_redis ~* +@all

  # =========================
  # Fafnir wallet
  # =========================
  consumer-fafnir-setup:
    container_name: "${EUNOMIA_PREFIX:-eunomia}-consumer-fafnir-setup"
    image: "${FAFNIR_IMAGE:?set FAFNIR_IMAGE in versions.env}:${FAFNIR_TAG:?set FAFNIR_TAG in versions.env}"
    platform: linux/amd64
    depends_on:
      consumer-db:
        condition: service_healthy
    volumes:
      - ./../../static/config/consumer/standalone/fafnir.consumer.yaml:/app/static/fafnir/config.yaml
      - ./../../vault/consumer/secrets/db.json.example:/app/vault/secrets/db.json.example
    env_file:
      - ./../../static/envs/consumer/fafnir.env.example
    environment:
      RUST_BACKTRACE: 1
    command: ["setup", "--env-file", "/app/static/fafnir/config.yaml"]
    restart: "no"

  consumer-fafnir-wallet:
    container_name: "${EUNOMIA_PREFIX:-eunomia}-consumer-fafnir-wallet"
    image: "${FAFNIR_IMAGE:?set FAFNIR_IMAGE in versions.env}:${FAFNIR_TAG:?set FAFNIR_TAG in versions.env}"
    platform: linux/amd64
    restart: always
    depends_on:
      consumer-fafnir-setup:
        condition: service_completed_successfully
    volumes:
      - ./../../static/config/consumer/standalone/fafnir.consumer.yaml:/app/static/fafnir/config.yaml
      - ./../../vault/consumer/secrets/db.json.example:/app/vault/secrets/db.json.example
    env_file:
      - ./../../static/envs/consumer/fafnir.env.example
    environment:
      RUST_BACKTRACE: 1
    command: ["start", "--env-file", "/app/static/fafnir/config.yaml"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7001/readiness"]
      interval: 10s
      timeout: 2s
      retries: 10
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # =========================
  # Setup job (one-shot)
  # =========================
  consumer-setup:
    container_name: "${EUNOMIA_PREFIX:-eunomia}-consumer-setup"
    image: "${EUNOMIA_IMAGE:?set EUNOMIA_IMAGE in versions.env}:${EUNOMIA_TAG:?set EUNOMIA_TAG in versions.env}"
    platform: linux/amd64
    command: ["setup", "-e", "/app/static/config/standalone.consumer.yaml"]
    volumes:
      - ./../../static/config/consumer/standalone:/app/static/config
      - ./../../static/specs/agent:/app/static/specs
      - ./../../static/policy_templates:/app/static/policy_templates
      - ./../../vault/consumer:/app/vault
    depends_on:
      - consumer-db
      - consumer-redis
    env_file:
      - ./../../static/envs/consumer/core.env.example
    restart: "no"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # =========================
  # Main service
  # =========================
  consumer:
    container_name: "${EUNOMIA_PREFIX:-eunomia}-consumer"
    image: "${EUNOMIA_IMAGE:?set EUNOMIA_IMAGE in versions.env}:${EUNOMIA_TAG:?set EUNOMIA_TAG in versions.env}"
    platform: linux/amd64
    command: ["start", "-e", "/app/static/config/standalone.consumer.yaml"]
    ports:
      - "1100:1100"
    volumes:
      - ./../../static/config/consumer/standalone:/app/static/config
      - ./../../static/specs/agent:/app/static/specs
      - ./../../static/policy_templates:/app/static/policy_templates
      - ./../../vault/consumer:/app/vault
    depends_on:
      consumer-setup:
        condition: service_completed_successfully
      consumer-db:
        condition: service_started
      consumer-redis:
        condition: service_started
      consumer-fafnir-wallet:
        condition: service_healthy
    env_file:
      - ./../../static/envs/consumer/core.env.example
    environment:
      RUST_BACKTRACE: full
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:1100/api/v1/readiness"]
      interval: 5s
      timeout: 2s
      retries: 24
    extra_hosts:
      - "host.docker.internal:host-gateway"
