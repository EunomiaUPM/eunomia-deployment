name: mini-consumer

services:
  consumer-db:
    container_name: "consumer-db"
    image: "postgres"
    restart: always
    env_file:
      - ./../../static/envs/consumer/db.env.example
    ports:
      - "1300:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U mini_consumer" ]
      interval: 10s
      retries: 10

  consumer-redis:
    image: redis:alpine
    restart: always
    container_name: consumer-redis
    ports:
      - "6380:6379"
    command: >
      redis-server 
      --requirepass ds_core_consumer_redis
      --user admin on >ds_core_consumer_redis ~* +@all

  consumer-fafnir-setup:
    container_name: "consumer-fafnir-setup"
    image: "rmenendez8/fafnir:v0.3.0"
    restart: "no"
    depends_on:
      consumer-db:
        condition: service_healthy
    volumes:
      - ./../../static/config/fafnir/consumer.yaml:/app/static/fafnir/config.yaml
      - ./../../vault/consumer/secrets/db.json.example:/app/vault/secrets/db.json.example
    env_file:
      - ./../../static/envs/fafnir/env.example
    environment:
      RUST_BACKTRACE: 1
    command:
      - setup
      - --env-file
      - /app/static/fafnir/config.yaml

  consumer-fafnir-wallet:
    container_name: "consumer-fafnir-wallet"
    image: "rmenendez8/fafnir:v0.3.0"
    restart: always
    depends_on:
      consumer-fafnir-setup:
        condition: service_completed_successfully
    volumes:
      - ./../../static/config/fafnir/consumer.yaml:/app/static/fafnir/config.yaml
      - ./../../vault/consumer/secrets/db.json.example:/app/vault/secrets/db.json.example
    env_file:
      - ./../../static/envs/fafnir/env.example
    environment:
      RUST_BACKTRACE: 1
    command:
      - start
      - --env-file
      - /app/static/fafnir/config.yaml
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:7001/readiness" ]
      interval: 10s
      timeout: 2s
      retries: 10
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - ds-mini


  # =========================
  # Setup job (one-shot)
  # =========================
  consumer-setup:
    container_name: consumer-setup
    image: "rmenendez8/eunomia:v1.6.test"
    command: ["setup", "-e", "/app/static/config/mini.consumer.yaml"]
    volumes:
      - ./../../static/specs/agent/:/app/static/specs/
      - ./../../vault/consumer/:/app/vault
      - ./../../static/config/consumer/mini:/app/static/config
    depends_on:
      - consumer-db
      - consumer-redis
    env_file:
      - ./../../static/envs/consumer/core.env.example
    restart: "no"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # =========================
  # Main service
  # =========================
  consumer:
    container_name: consumer
    image: "rmenendez8/eunomia:v1.6.test"
    command: ["start", "-e", "/app/static/config/mini.consumer.yaml"]
    ports:
      - "1100:1100"
    volumes:
      - ./../../static/specs/agent/:/app/static/specs/
      - ./../../vault/consumer/:/app/vault
      - ./../../static/config/consumer/mini:/app/static/config
    depends_on:
      consumer-setup:
        condition: service_completed_successfully
      consumer-db:
        condition: service_started
      consumer-redis:
        condition: service_started
      consumer-fafnir-wallet:
        condition: service_healthy
    env_file:
      - ./../../static/envs/consumer/core.env.example
    environment:
      RUST_BACKTRACE: full
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - ds-mini

networks:
  ds-mini:
    name: ds-mini
    external: true
