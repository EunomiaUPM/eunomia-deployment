name: mini-heimdall

services:
  heimdall-db:
    container_name: heimdall-db
    image: postgres
    restart: always
    env_file:
      - ./../../static/envs/heimdall/db.env.example
    ports:
      - "1450:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U mini_heimdall" ]
      interval: 10s
      retries: 10

  fafnir-setup:
    container_name: "fafnir-setup"
    image: "rmenendez8/fafnir:v0.3.test"
    restart: "no"
    depends_on:
      heimdall-db:
        condition: service_healthy
    volumes:
      - ./../../static/config/fafnir/heimdall.yaml:/app/static/fafnir/config.yaml
      - ./../../vault/heimdall/secrets/db.json.example:/app/vault/secrets/db.json.example
    env_file:
      - ./../../static/envs/fafnir/env.example
    environment:
      RUST_BACKTRACE: 1
    command:
      - setup
      - --env-file
      - /app/static/fafnir/config.yaml

  fafnir-wallet:
    container_name: "fafnir-wallet"
    image: "rmenendez8/fafnir:v0.3.test"
    restart: always
    depends_on:
      fafnir-setup:
        condition: service_completed_successfully
    volumes:
      - ./../../static/config/fafnir/heimdall.yaml:/app/static/fafnir/config.yaml
      - ./../../vault/heimdall/secrets/db.json.example:/app/vault/secrets/db.json.example
    env_file:
      - ./../../static/envs/fafnir/env.example
    environment:
      RUST_BACKTRACE: 1
    command:
      - start
      - --env-file
      - /app/static/fafnir/config.yaml
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:7001/readiness" ]
      interval: 10s
      timeout: 2s
      retries: 10
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - ds-mini

  heimdall-setup:
    container_name: heimdall-setup
    image: rmenendez8/heimdall:v2.2.test
    restart: "no"
    depends_on:
      heimdall-db:
        condition: service_healthy
    volumes:
      - ./../../static/config/heimdall/mini/:/app/static/config
      - ./../../static/specs/heimdall/openapi/:/app/static/specs/openapi/
      - ./../../vault/heimdall:/app/vault
    env_file:
      - ./../../static/envs//heimdall/heimdall.env.example
    environment:
      RUST_BACKTRACE: 1
    command:
      - setup
      - --env-file
      - /app/static/config/mini_eco_authority.yaml

  heimdall:
    container_name: heimdall
    image: rmenendez8/heimdall:v2.2.test
    restart: always
    ports:
      - "1500:1500"
    depends_on:
      heimdall-setup:
        condition: service_completed_successfully
      fafnir-wallet:
        condition: service_healthy
    volumes:
      - ./../../static/config/heimdall/mini/:/app/static/config
      - ./../../static/specs/heimdall/openapi/:/app/static/specs/openapi/
      - ./../../vault/heimdall:/app/vault
    env_file:
      - ./../../static/envs//heimdall/heimdall.env.example
    environment:
      RUST_BACKTRACE: 1
    command:
      - start
      - --env-file
      - /app/static/config/mini_eco_authority.yaml
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:1500/api/v1/readiness" ]
      interval: 10s
      timeout: 2s
      retries: 10
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - ds-mini

networks:
  ds-mini:
    name: ds-mini
    external: true
