name: mini-keycloak

services:
  # Edge: the only published port. Protocol routes go straight to each component; user routes
  # ask that component's oauth2-proxy (gatekeeper) first. The aliases make the containers enter
  # by the same names as the browser.
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./../../static/config/nginx/mini/conf.d:/etc/nginx/conf.d:ro
      - ./../../static/config/nginx/mini/snippets:/etc/nginx/snippets:ro
    networks:
      ds-mini:
        aliases:
          - keycloak.localhost
          - authority.localhost
          - provider.localhost
          - consumer.localhost

  # Former edge (it only gave names to the proxies), replaced by nginx:
  # caddy:
  #   image: caddy:2.8.4
  #   container_name: caddy
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #   volumes:
  #     - ./../../static/config/caddy/mini/Caddyfile:/etc/caddy/Caddyfile:ro
  #   networks:
  #     ds-mini:
  #       aliases:
  #         - keycloak.localhost
  #         - authority.localhost
  #         - provider.localhost
  #         - consumer.localhost

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    container_name: keycloak
    restart: unless-stopped
    env_file:
      - ./../../static/envs/keycloak/mini.env.example
    environment:
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://keycloak.localhost
      KC_PROXY_HEADERS: xforwarded
    command: ["start-dev", "--import-realm"]
    volumes:
      - ./../../static/config/keycloak/mini:/opt/keycloak/data/import:ro
      - ./../../static/react/keycloak-theme/eunomia:/opt/keycloak/themes/eunomia:ro
    networks:
      - ds-mini
    healthcheck:
      test:
        - "CMD-SHELL"
        - "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

networks:
  ds-mini:
    name: ds-mini
    external: true
