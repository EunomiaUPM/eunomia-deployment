services:
  heimdall-setup:
    command:
      - setup
      - --env-file
      - /app/static/config/mini_eco_authority.keycloak.yaml

  heimdall:
    command:
      - start
      - --env-file
      - /app/static/config/mini_eco_authority.keycloak.yaml
    ports: !reset []

  heimdall-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.4
    container_name: heimdall-proxy
    restart: unless-stopped
    env_file:
      - ./../../static/envs/heimdall/proxy.mini.env.example
    volumes:
      - ./../../static/react/proxy-templates-mini:/templates:ro
    networks:
      - default
      - ds-mini
    command:
      - --provider=keycloak-oidc
      - --oidc-issuer-url=http://keycloak.localhost/realms/authority
      - --redirect-url=http://authority.localhost/oauth2/callback
      - --whitelist-domain=authority.localhost
      - --backend-logout-url=http://keycloak.localhost/realms/authority/protocol/openid-connect/logout?id_token_hint={id_token}
      - --http-address=0.0.0.0:4180
      - --reverse-proxy=true
      # Gatekeeper behind nginx (auth_request): answers whether the session is valid and, on
      # 202, the user's token (X-Auth-Request-Access-Token), which nginx forwards to the
      # component. It proxies nothing, so the routes it does not guard are not its concern.
      - --upstream=static://202
      - --set-xauthrequest=true
      - --pass-access-token=true
      - --cookie-refresh=25m
      - --email-domain=*
      - --code-challenge-method=S256
      - --skip-provider-button=false
      - --custom-templates-dir=/templates
      - --provider-display-name=Authority
      - --skip-jwt-bearer-tokens=true
      - --cookie-secure=false
      # Former in-line proxy flags (it proxied everything and nginx was Caddy):
      # - --http-address=0.0.0.0:4180
      # - --reverse-proxy=true
      # - --upstream=http://heimdall:1500/
      # - --email-domain=*
      # - --code-challenge-method=S256
      # - --pass-user-headers=true
      # # The user's token goes in X-Forwarded-Access-Token, so Authorization reaches the
      # # component untouched on the protocol routes (GNAP, DSP, OID4VCI tokens).
      # - --pass-access-token=true
      # - --skip-provider-button=false
      # - --custom-templates-dir=/templates
      # - --provider-display-name=Authority
      # - --skip-jwt-bearer-tokens=true
      # - --cookie-secure=false
      # - '--api-route=^/admin/api/'
      # - '--api-route=^/api/'
      # - '--skip-auth-route=^/\.well-known/(did\.json|openid-credential-issuer|oauth-authorization-server|federated-catalog)$$'
      # - '--skip-auth-route=^/api/v1/gate/(access|continue/[^/.][^/]*)$$'
      # - '--skip-auth-route=^/api/v1/issuer/(credentialOffer|token|credential)$$'
      # - '--skip-auth-route=^/api/v1/verifier/(pd|verify)/[^/.][^/]*$$'
